name: 问题反馈 / Bug report
description: 报告连接、灯光或按键设置问题 / Report connection, lighting or remapping issues.
body:
  - type: input
    id: version
    attributes:
      label: 软件版本 / App version
      description: 在侧栏或使用说明页查看 / See the sidebar or help page.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本和处理器 / macOS version and processor
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: 键盘型号、USB VID/PID / Keyboard model and USB VID/PID
      description: 不要填写序列号 / Do not include serial numbers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与预期结果 / Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与窗口状态 / Actual behavior and app status
      description: 请区分设备读回与实物灯光；不要贴私人宏或按键内容 / Distinguish readback from visible LEDs; omit private macros and input contents.
    validations:
      required: true
